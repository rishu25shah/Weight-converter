<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Instant, precision weight conversion between Kilograms (kg), Pounds (lbs), Grams (g), Ounces (oz), and Stones (st). Fast, modern, and beautifully designed.">
  <title>Weight Converter | Precision Kilograms & Pounds Converter</title>
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 3a9 9 0 0 0-9 9 9 9 0 0 0 9 9 9 9 0 0 0 9-9 9 9 0 0 0-9-9zm0 2a7 7 0 0 1 7 7c0 1.5-.5 2.9-1.3 4.1l-3.3-3.3a2.5 2.5 0 0 0-3.5-3.5L7.6 6.1C8.8 5.4 10.3 5 12 5z'/></svg>">
  
  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow orbs -->
  <div class="ambient-glow top-left"></div>
  <div class="ambient-glow bottom-right"></div>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="M7 21h10"/>
            <path d="M12 3v18"/>
            <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Weight Converter</h1>
          <p class="brand-subtitle">Bidirectional Precision Unit Conversion</p>
        </div>
      </div>
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle dark/light mode" aria-label="Toggle theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/>
          <path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/>
          <path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/>
          <path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/>
          <path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>
    </header>

    <!-- Main Converter Card -->
    <section class="converter-card" aria-label="Weight Converter Tool">
      <!-- Input Section -->
      <div class="input-section">
        <div class="label-row">
          <label for="weight-input" class="field-label">Enter Weight</label>
          <button type="button" id="quick-clear-btn" class="quick-clear-btn" aria-label="Clear weight input">Clear</button>
        </div>
        <div class="input-box-wrapper">
          <input 
            type="number" 
            id="weight-input" 
            class="weight-input" 
            placeholder="0.0" 
            step="any"
            min="0"
            value="70"
            autocomplete="off"
            aria-label="Weight value"
          >
          <span id="input-unit-badge" class="input-unit-badge">KG</span>
        </div>

        <!-- Quick Preset Weight Buttons -->
        <div class="presets-container" aria-label="Quick preset values">
          <button type="button" class="preset-chip" data-val="50">50</button>
          <button type="button" class="preset-chip" data-val="65">65</button>
          <button type="button" class="preset-chip" data-val="70">70</button>
          <button type="button" class="preset-chip" data-val="80">80</button>
          <button type="button" class="preset-chip" data-val="100">100</button>
          <button type="button" class="preset-chip" data-val="150">150</button>
        </div>
      </div>

      <!-- Units Switcher Bar -->
      <div class="conversion-units-bar">
        <div class="unit-selector-wrapper">
          <label for="from-unit-select" class="unit-select-label">From Unit</label>
          <select id="from-unit-select" class="unit-select" aria-label="Convert from unit">
            <option value="kg" selected>Kilograms (kg)</option>
            <option value="lbs">Pounds (lbs)</option>
            <option value="g">Grams (g)</option>
            <option value="oz">Ounces (oz)</option>
            <option value="st">Stones (st)</option>
          </select>
        </div>

        <button type="button" id="swap-units-btn" class="swap-btn" title="Swap Units" aria-label="Swap from and to units">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3 4 7l4 4"/>
            <path d="M4 7h16"/>
            <path d="m16 21 4-4-4-4"/>
            <path d="M20 17H4"/>
          </svg>
        </button>

        <div class="unit-selector-wrapper">
          <label for="to-unit-select" class="unit-select-label">To Unit</label>
          <select id="to-unit-select" class="unit-select" aria-label="Convert to unit">
            <option value="kg">Kilograms (kg)</option>
            <option value="lbs" selected>Pounds (lbs)</option>
            <option value="g">Grams (g)</option>
            <option value="oz">Ounces (oz)</option>
            <option value="st">Stones (st)</option>
          </select>
        </div>
      </div>

      <!-- Result Card -->
      <div class="result-card">
        <div class="result-header">
          <span class="result-label">Converted Result</span>
          <button type="button" id="copy-result-btn" class="copy-btn" title="Copy result to clipboard" aria-label="Copy result">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            </svg>
            <span id="copy-text">Copy</span>
          </button>
        </div>

        <div class="result-display">
          <span id="result-value" class="result-value">154.4</span>
          <span id="result-unit" class="result-unit">LBS</span>
        </div>

        <div class="formula-text">
          <span>Formula:</span>
          <span id="formula-display" class="formula-pill">70 × 2.205 = 154.4 LBS</span>
        </div>
      </div>

      <!-- Options Bar: Decimals -->
      <div class="options-bar">
        <span>Decimal Precision:</span>
        <div class="precision-btn-group" role="group" aria-label="Decimal Precision Selection">
          <button type="button" class="precision-btn active" data-precision="1">1 dec</button>
          <button type="button" class="precision-btn" data-precision="2">2 dec</button>
          <button type="button" class="precision-btn" data-precision="4">4 dec</button>
        </div>
      </div>
    </section>

    <!-- Recent History Card -->
    <section class="history-card" aria-label="Conversion History">
      <div class="history-header">
        <h2 class="history-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          Recent Conversions
        </h2>
        <button type="button" id="clear-history-btn" class="clear-history-btn">Clear</button>
      </div>
      <ul id="history-list" class="history-list">
        <li class="history-empty">No conversions yet. Enter a value to convert!</li>
      </ul>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Precision Weight Converter &bull; Kilograms &harr; Pounds</p>
    </footer>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="toast-message">Copied to clipboard!</span>
  </div>

  <!-- JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
